name: Actualización automática

on:
  schedule:
    # Búsqueda rápida de variantes por DNS, cada 5 minutos (menos el minuto 15, que es la completa).
    - cron: "0,5,10,20,25,30,35,40,45,50,55 * * * *"
    # Corrida completa cada hora al minuto 15 (incluye las 5:15 am de Mérida, 11:15 UTC):
    # también reportes públicos y revisión de alertas abiertas.
    - cron: "15 * * * *"
  workflow_dispatch: {}         # permite correrlo a mano desde la pestaña Actions (corrida completa)

# Nunca dos corridas al mismo tiempo: si una tarda, la siguiente espera.
concurrency:
  group: actualizacion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dnstwist (generador de variantes)
        run: python -m pip install -r requirements.txt
      - name: Buscar sitios que suplantan a los clientes y avisarles
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Correo de alertas (opcional: sin estos secretos las alertas solo aparecen en el panel)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EVENTO: ${{ github.event_name }}
          HORARIO: ${{ github.event.schedule }}
        run: |
          if [ "$EVENTO" = "schedule" ] && [ "$HORARIO" != "15 * * * *" ]; then
            python scripts/actualizar.py --rapida
          else
            python scripts/actualizar.py
          fi
